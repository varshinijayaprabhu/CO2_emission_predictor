<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Carbon Pulse</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍂 </text></svg>">
    <link rel="stylesheet" href="main.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  </head>
  <body>
    <div class="container">
      <h1>Carbon Pulse</h1>
      
      <div class="split-container">
        <!-- Input Section -->
        <div class="left-panel">
          <form id="predict-form">
            <div class="input-group">
              <label for="fuel_comb">Combined Fuel (L/100km)</label>
              <input type="number" step="0.1" id="fuel_comb" placeholder="e.g. 8.5" required />
            </div>
            
            <div class="input-group">
              <label for="fuel_city">City Fuel (L/100km)</label>
              <input type="number" step="0.1" id="fuel_city" placeholder="e.g. 10.2" required />
            </div>

            <div class="input-group">
              <label for="fuel_hwy">Highway Fuel (L/100km)</label>
              <input type="number" step="0.1" id="fuel_hwy" placeholder="e.g. 6.8" required />
            </div>
            
            <div class="input-group">
              <label for="engine_size">Engine Size (L)</label>
              <input type="number" step="0.1" id="engine_size" placeholder="e.g. 2.4" required />
            </div>
            
            <button type="submit">Analyze Emissions</button>
          </form>
          
          <div id="result"></div>
        </div>

        <!-- Visualization Section -->
        <div class="right-panel">
          <div class="chart-card">
            <canvas id="gauge" width="300" height="200"></canvas>
          </div>
          <div class="chart-card">
            <canvas id="pie" width="300" height="300"></canvas>
          </div>
        </div>
      </div>
    </div>

    <footer>
      <p>Designed and Developed by <strong>Varshini J</strong></p>
      <div class="footer-links">
        <a href="https://github.com/varshinijayaprabhu" target="_blank"><i class="fab fa-github"></i></a>
        <a href="https://www.linkedin.com/in/varshinij2004/" target="_blank"><i class="fab fa-linkedin"></i></a>
        <a href="mailto:varshini.j.512004@gmail.com"><i class="fas fa-envelope"></i></a>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
